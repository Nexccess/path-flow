name: Sales Engine CI

on:
  pull_request:
    paths:
      - 'sales_engine/**'
      - '.github/workflows/sales-engine-ci.yml'
  push:
    branches:
      - sales-engine-mvp
      - lead-supply-engine-v1
      - screening-automation-v1
      - lead-discovery-v1
      - lp-production-e2e-v1
    paths:
      - 'sales_engine/**'
      - '.github/workflows/sales-engine-ci.yml'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sales_engine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall .

      - name: Run Lead Supply tests
        run: python -m unittest -v test_lead_supply_engine.py

      - name: Run Screening Automation tests
        run: python -m unittest -v test_screening_automation.py

      - name: Run Lead Discovery tests
        run: python -m unittest -v test_lead_discovery.py

      - name: Run LP Production tests
        run: python -m unittest -v test_lp_production.py

      - name: Run existing Sales Engine tests
        run: |
          python -m unittest -v \
            test_response_flow.py \
            test_agent_response_pipeline.py
